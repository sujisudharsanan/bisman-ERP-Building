name: E2E Quick (Cypress) - PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'my-frontend/cypress/**'
      - 'my-frontend/package.json'
      - 'my-frontend/src/**'
      - '.github/workflows/e2e_quick.yml'

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e_quick:
    name: Cypress Quick Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: my-frontend

    env:
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: my-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cypress TypeScript compilation
        run: npx tsc --noEmit --project cypress/tsconfig.json

      - name: Start backend (if local)
        run: |
          echo "Assuming tests run against CI/available staging environment."
          echo "If running locally, start backend services here."
        # Uncomment below to start local backend:
        # cd ../my-backend && npm ci && npm run start &
        # sleep 10

      - name: Wait for application
        run: |
          echo "Waiting for application to be ready..."
          sleep 5

      - name: Run Quick E2E Tests
        env:
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL || 'http://localhost:3001' }}
          CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL || 'http://localhost:5000' }}
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'arun.kumar@bisman.demo' }}
          CYPRESS_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Demo@123' }}
          CYPRESS_HUB_INCHARGE_EMAIL: ${{ secrets.HUB_INCHARGE_EMAIL }}
          CYPRESS_STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          CYPRESS_VIEWER_EMAIL: ${{ secrets.VIEWER_EMAIL }}
        run: |
          npm run e2e:quick

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: my-frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: my-frontend/cypress/videos
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: |
            my-frontend/cypress/results
            my-frontend/cypress/reports
          retention-days: 7
          if-no-files-found: ignore

  # Optional: Run full suite on merge to main
  e2e_full:
    name: Cypress Full Suite (Main Branch Only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: my-frontend

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: my-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Full E2E Suite (no perf)
        env:
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL || 'http://localhost:3001' }}
          CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL || 'http://localhost:5000' }}
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          npm run e2e:no-perf

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-full-results
          path: |
            my-frontend/cypress/screenshots
            my-frontend/cypress/videos
          retention-days: 14
